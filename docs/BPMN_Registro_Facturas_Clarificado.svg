    .gw{fill:#fff3d6;stroke:#c58a1d;stroke-width:7}
    .gq{font:bold 26px Arial;fill:#6b4b10;text-anchor:middle}
    .lab{font:bold 24px Arial;fill:#264f72}
    .flow{fill:none;stroke:#264f72;stroke-width:7;marker-end:url(#a);stroke-linejoin:round;stroke-linecap:round}
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="2100" y="68" class="head" text-anchor="middle">BPMN - Registro y gestion de facturas</text>
