<svg xmlns="http://www.w3.org/2000/svg" width="5200" height="1550" viewBox="0 0 5200 1550">
<defs>
<marker id="a" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#244d70"/></marker>
<style>
.h{font: bold 46px Arial;fill:#173a59}.sub{font:26px Arial;fill:#536879}
.l{font:bold 28px Arial;fill:#214a6d;text-anchor:middle}
.t{font:26px Arial;fill:#17324d;text-anchor:middle}
.g{font:bold 24px Arial;fill:#765210;text-anchor:middle}
.b{font:bold 22px Arial;fill:#244d70}
.flow{fill:none;stroke:#244d70;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}
.task{fill:#edf4f9;stroke:#315f86;stroke-width:6}
.err{fill:#fff0f0;stroke:#c94b4b;stroke-width:6}
.ok{fill:#eaf6ee;stroke:#23965b;stroke-width:6}
</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="2600" y="62" class="h" text-anchor="middle">BPMN - Registro y gestion de facturas | Aires Software</text>
<text x="2600" y="100" class="sub" text-anchor="middle">Recorrido completo: carga, reconocimiento, revision, validacion y consulta</text>
<!-- pool and lanes -->
<rect x="45" y="130" width="5110" height="1360" rx="28" fill="#fff" stroke="#315f86" stroke-width="8"/>
<rect x="85" y="170" width="5030" height="420" fill="#f4f8fc" stroke="#9bb6cc" stroke-width="4"/>
<rect x="85" y="590" width="5030" height="550" fill="#f8fafc" stroke="#9bb6cc" stroke-width="4"/>
<rect x="85" y="1140" width="5030" height="310" fill="#f4f8fc" stroke="#9bb6cc" stroke-width="4"/>
<rect x="85" y="170" width="280" height="420" fill="#e6eef5" stroke="#9bb6cc" stroke-width="4"/>
<rect x="85" y="590" width="280" height="550" fill="#e6eef5" stroke="#9bb6cc" stroke-width="4"/>
<rect x="85" y="1140" width="280" height="310" fill="#e6eef5" stroke="#9bb6cc" stroke-width="4"/>
<text x="225" y="355" class="l">USUARIO</text><text x="225" y="395" class="l">ADMINISTRATIVO</text>
<text x="225" y="825" class="l">SISTEMA DE</text><text x="225" y="865" class="l">RECONOCIMIENTO</text>
<text x="225" y="1285" class="l">ADMINISTRACION</text><text x="225" y="1325" class="l">/ CONTROL</text>
<!-- sequence flows behind elements -->
<path class="flow" d="M590 370 H670"/>
<path class="flow" d="M930 370 H1050 V840 H1120"/>
<path class="flow" d="M1380 840 H1540"/>
<path class="flow" d="M1700 840 H1850"/>
<path class="flow" d="M1620 920 V1015 H1800"/>
<path class="flow" d="M2120 1015 H2260"/>
<path class="flow" d="M2110 840 H2190"/>
<path class="flow" d="M2450 840 H2580 V370 H2570"/>
<path class="flow" d="M2830 370 H2970"/>
<path class="flow" d="M3130 370 H3290"/>
<path class="flow" d="M3420 250 V190 H2700 V240"/>
<path class="flow" d="M3050 450 V840 H3280"/>
<path class="flow" d="M3560 840 H3710"/>
<path class="flow" d="M3790 920 V960"/>
<path class="flow" d="M3660 1030 H3600 V370 H3550"/>
<path class="flow" d="M3870 840 H3970"/>
<path class="flow" d="M4230 840 H4300"/>
<path class="flow" d="M4560 840 H4600 V1280 H4550"/>
<path class="flow" d="M4850 1280 H4950"/>
<!-- start and task nodes -->
<circle cx="520" cy="370" r="42" fill="#fff" stroke="#23965b" stroke-width="8"/>
<rect class="task" x="670" y="300" width="260" height="140" rx="22"/>
<text class="t" x="800" y="355"><tspan x="800">Cargar factura</tspan><tspan x="800" dy="34">(imagen o PDF)</tspan></text>
<rect class="task" x="1120" y="770" width="260" height="140" rx="22"/>
<text class="t" x="1250" y="825"><tspan x="1250">Verificar formato</tspan><tspan x="1250" dy="34">y legibilidad</tspan></text>
<polygon points="1620,760 1700,840 1620,920 1540,840" fill="#fff3d6" stroke="#c58a1d" stroke-width="7"/>
<path d="M1595 815 L1645 865 M1645 815 L1595 865" stroke="#9a6a12" stroke-width="7"/>
<text class="g" x="1620" y="730">Archivo valido?</text>
<rect class="task" x="1850" y="770" width="260" height="140" rx="22"/>
<text class="t" x="1980" y="825"><tspan x="1980">Reconocer datos</tspan><tspan x="1980" dy="34">de la factura</tspan></text>
<rect class="task" x="2190" y="770" width="260" height="140" rx="22"/>
<text class="t" x="2320" y="825"><tspan x="2320">Mostrar datos</tspan><tspan x="2320" dy="34">reconocidos</tspan></text>
<rect class="err" x="1800" y="945" width="320" height="140" rx="22"/>
<text class="t" x="1960" y="1000"><tspan x="1960">Informar error y</tspan><tspan x="1960" dy="34">solicitar otro archivo</tspan></text>
<circle cx="2260" cy="1015" r="42" fill="#fff" stroke="#c94b4b" stroke-width="8"/><circle cx="2260" cy="1015" r="29" fill="none" stroke="#c94b4b" stroke-width="6"/>
<text class="sub" x="2260" y="1090" text-anchor="middle">Fin del intento</text>
<rect class="task" x="2570" y="300" width="260" height="140" rx="22"/>
<text class="t" x="2700" y="355"><tspan x="2700">Revisar datos</tspan><tspan x="2700" dy="34">reconocidos</tspan></text>
<polygon points="3050,290 3130,370 3050,450 2970,370" fill="#fff3d6" stroke="#c58a1d" stroke-width="7"/>
<path d="M3025 345 L3075 395 M3075 345 L3025 395" stroke="#9a6a12" stroke-width="7"/>
<text class="g" x="3050" y="255">Datos completos y correctos?</text>
<rect class="task" x="3290" y="300" width="260" height="140" rx="22"/>
<text class="t" x="3420" y="355"><tspan x="3420">Corregir datos</tspan><tspan x="3420" dy="34">observados</tspan></text>
<rect class="task" x="3280" y="770" width="280" height="140" rx="22"/>
<text class="t" x="3420" y="825"><tspan x="3420">Validar campos y</tspan><tspan x="3420" dy="34">posibles duplicados</tspan></text>
<polygon points="3790,760 3870,840 3790,920 3710,840" fill="#fff3d6" stroke="#c58a1d" stroke-width="7"/>
<path d="M3765 815 L3815 865 M3815 815 L3765 865" stroke="#9a6a12" stroke-width="7"/>
<text class="g" x="3790" y="730">Validacion aprobada?</text>
<rect class="err" x="3660" y="960" width="280" height="140" rx="22"/>
<text class="t" x="3800" y="1015"><tspan x="3800">Informar</tspan><tspan x="3800" dy="34">observaciones</tspan></text>
<rect class="ok" x="3970" y="770" width="260" height="140" rx="22"/>
<text class="t" x="4100" y="825"><tspan x="4100">Guardar factura</tspan><tspan x="4100" dy="34">y sus detalles</tspan></text>
<rect class="task" x="4300" y="770" width="260" height="140" rx="22"/>
<text class="t" x="4430" y="825"><tspan x="4430">Confirmar</tspan><tspan x="4430" dy="34">registro</tspan></text>
<rect class="task" x="4550" y="1210" width="300" height="140" rx="22"/>
<text class="t" x="4700" y="1265"><tspan x="4700">Consultar registro</tspan><tspan x="4700" dy="34">para controles y reportes</tspan></text>
<circle cx="4990" cy="1280" r="42" fill="#fff" stroke="#23965b" stroke-width="8"/><circle cx="4990" cy="1280" r="29" fill="none" stroke="#23965b" stroke-width="6"/>
<!-- yes / no branch labels -->
<text x="1720" y="820" class="b">SI</text><text x="1635" y="960" class="b">NO</text>
<text x="3145" y="350" class="b">NO</text><text x="3075" y="500" class="b">SI</text>
<text x="3900" y="820" class="b">SI</text><text x="3805" y="950" class="b">NO</text>
<text x="2100" y="1490" class="sub">Las compuertas muestran las decisiones; los retornos indican donde se corrigen los datos.</text>
</svg>