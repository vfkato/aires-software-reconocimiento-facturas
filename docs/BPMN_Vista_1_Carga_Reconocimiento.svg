 </defs><style>.taskbox{fill:#edf4f9;stroke:#315f86;stroke-width:5}.errorbox{fill:#fff0f0;stroke:#c94b4b;stroke-width:5}.successbox{fill:#eaf6ee;stroke:#23965b;stroke-width:5}.gatebox{fill:#fff3d6;stroke:#c58a1d;stroke-width:6}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="1300.0" y="58" class="title" text-anchor="middle">BPMN - Vista 1: carga y reconocimiento</text><text x="1300.0" y="96" class="subtitle" text-anchor="middle">Primera parte del proceso: incorporar el documento, comprobarlo y extraer sus datos</text><rect x="28" y="125" width="2544" height="1000" rx="24" fill="#fff" stroke="#315f86" stroke-width="7"/><text x="1300.0" y="153" class="pooltitle" text-anchor="middle">POOL: EMPRESA USUARIA</text><rect x="58" y="175" width="2484" height="250" fill="#f4f8fc" stroke="#9bb6cc" stroke-width="4"/><text x="88" y="210" class="lanehead">LANE: USUARIO ADMINISTRATIVO</text><rect x="58" y="425" width="2484" height="425" fill="#f8fafc" stroke="#9bb6cc" stroke-width="4"/><text x="88" y="460" class="lanehead">LANE: SISTEMA DE RECONOCIMIENTO</text><rect x="58" y="850" width="2484" height="165" fill="#f4f8fc" stroke="#9bb6cc" stroke-width="4"/><text x="88" y="885" class="lanehead">LANE: ADMINISTRACIÓN / CONTROL</text><path class="flow" d="M425 300 H500"/><path class="flow" d="M780 300 H850 V635 H920"/><path class="flow" d="M1180 635 H1235"/><path class="flow" d="M1365 635 H1450"/><path class="flow" d="M1300 700 V780 H1480"/><path class="flow" d="M1780 635 H1850"/><path class="flow" d="M1980 575 V500 H2110 V300 H2140"/><path class="flow" d="M1780 780 H1900"/><circle cx="395" cy="300" r="26" fill="#e7f5eb" stroke="#26965b" stroke-width="6"/><rect x="500" y="240" width="280" height="120" rx="20" class="taskbox"/><text x="640.0" y="293.0" class="task" text-anchor="middle"><tspan x="640.0" dy="0">Cargar factura</tspan><tspan x="640.0" dy="30">(imagen o PDF)</tspan></text><rect x="920" y="575" width="260" height="120" rx="20" class="taskbox"/><text x="1050.0" y="628.0" class="task" text-anchor="middle"><tspan x="1050.0" dy="0">Verificar formato</tspan><tspan x="1050.0" dy="30">y legibilidad</tspan></text><polygon points="1300,560 1375,635 1300,710 1225,635" class="gatebox"/><path d="M1278 613 l44 44 M1322 613 l-44 44" stroke="#8b6418" stroke-width="5" stroke-linecap="round"/><text x="1300" y="542" class="gateway" text-anchor="middle"><tspan x="1300" dy="0">¿Archivo</tspan><tspan x="1300" dy="27">válido?</tspan></text><rect x="1450" y="575" width="330" height="120" rx="20" class="taskbox"/><text x="1615.0" y="628.0" class="task" text-anchor="middle"><tspan x="1615.0" dy="0">Reconocer datos</tspan><tspan x="1615.0" dy="30">de la factura</tspan></text><rect x="1850" y="575" width="260" height="120" rx="20" class="taskbox"/><text x="1980.0" y="628.0" class="task" text-anchor="middle"><tspan x="1980.0" dy="0">Mostrar datos</tspan><tspan x="1980.0" dy="30">reconocidos</tspan></text><rect x="2140" y="240" width="320" height="120" rx="20" class="taskbox"/><text x="2300.0" y="293.0" class="task" text-anchor="middle"><tspan x="2300.0" dy="0">Recibir datos</tspan><tspan x="2300.0" dy="30">para revisión</tspan></text><rect x="1480" y="730" width="300" height="100" rx="20" class="errorbox"/><text x="1630.0" y="773.0" class="task" text-anchor="middle"><tspan x="1630.0" dy="0">Informar error y</tspan><tspan x="1630.0" dy="30">solicitar otro archivo</tspan></text><circle cx="1930" cy="780" r="26" fill="#e7f5eb" stroke="#26965b" stroke-width="6"/><circle cx="1930" cy="780" r="18" fill="none" stroke="#26965b" stroke-width="5"/><text x="1930" y="830" class="note" text-anchor="middle"><tspan x="1930" dy="0">Fin del intento</tspan></text><text x="1390" y="605" class="branch">SÍ</text><text x="1320" y="750" class="branch">NO</text><text x="390" y="930" class="note" text-anchor="start"><tspan x="390" dy="0">Administración / Control interviene después de la confirmación del registro (vista 2).</tspan></text><text x="2200" y="415" class="note" 