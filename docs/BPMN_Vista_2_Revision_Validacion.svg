 </defs><style>.taskbox{fill:#edf4f9;stroke:#315f86;stroke-width:5}.errorbox{fill:#fff0f0;stroke:#c94b4b;stroke-width:5}.successbox{fill:#eaf6ee;stroke:#23965b;stroke-width:5}.gatebox{fill:#fff3d6;stroke:#c58a1d;stroke-width:6}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="1500.0" y="58" class="title" text-anchor="middle">BPMN - Vista 2: revisión, validación y almacenamiento</text><text x="1500.0" y="96" class="subtitle" text-anchor="middle">Continuación del proceso: corregir, validar, guardar y consultar</text><rect x="28" y="125" width="2944" height="1000" rx="24" fill="#fff" stroke="#315f86" stroke-width="7"/><text x="1500.0" y="153" class="pooltitle" text-anchor="middle">POOL: EMPRESA USUARIA</text><rect x="58" y="175" width="2884" height="250" fill="#f4f8fc" stroke="#9bb6cc" stroke-width="4"/><text x="88" y="210" class="lanehead">LANE: USUARIO ADMINISTRATIVO</text><rect x="58" y="425" width="2884" height="425" fill="#f8fafc" stroke="#9bb6cc" stroke-width="4"/><text x="88" y="460" class="lanehead">LANE: SISTEMA DE RECONOCIMIENTO</text><rect x="58" y="850" width="2884" height="165" fill="#f4f8fc" stroke="#9bb6cc" stroke-width="4"/><text x="88" y="885" class="lanehead">LANE: ADMINISTRACIÓN / CONTROL</text><path class="flow" d="M425 300 H500"/><path class="flow" d="M780 300 H865"/><path class="flow" d="M995 300 H1120"/><path class="flow" d="M1265 360 V395 H640 V360"/><path class="flow" d="M930 365 V610 H1450"/><path class="flow" d="M1750 610 H1785"/><path class="flow" d="M1855 680 V760 H2050"/><path class="flow" d="M2050 760 V445 H1265 V360"/><path class="flow" d="M1925 610 H2070"/><path class="flow" d="M2320 610 H2370"/><path class="flow" d="M2590 610 H2630 V930 H2660"/><path class="flow" d="M2910 930 H2940"/><circle cx="395" cy="300" r="26" fill="#e7f5eb" stroke="#26965b" stroke-width="6"/><rect x="500" y="240" width="280" height="120" rx="20" class="taskbox"/><text x="640.0" y="293.0" class="task" text-anchor="middle"><tspan x="640.0" dy="0">Revisar datos</tspan><tspan x="640.0" dy="30">reconocidos</tspan></text><polygon points="930,235 995,300 930,365 865,300" class="gatebox"/><path d="M908 278 l44 44 M952 278 l-44 44" stroke="#8b6418" stroke-width="5" stroke-linecap="round"/><text x="930" y="217" class="gateway" text-anchor="middle"><tspan x="930" dy="0">¿Datos completos</tspan><tspan x="930" dy="27">y correctos?</tspan></text><rect x="1120" y="240" width="290" height="120" rx="20" class="taskbox"/><text x="1265.0" y="293.0" class="task" text-anchor="middle"><tspan x="1265.0" dy="0">Corregir datos</tspan><tspan x="1265.0" dy="30">observados</tspan></text><rect x="1450" y="550" width="300" height="120" rx="20" class="taskbox"/><text x="1600.0" y="603.0" class="task" text-anchor="middle"><tspan x="1600.0" dy="0">Validar campos y</tspan><tspan x="1600.0" dy="30">posibles duplicados</tspan></text><polygon points="1855,540 1925,610 1855,680 1785,610" class="gatebox"/><path d="M1833 588 l44 44 M1877 588 l-44 44" stroke="#8b6418" stroke-width="5" stroke-linecap="round"/><text x="1855" y="522" class="gateway" text-anchor="middle"><tspan x="1855" dy="0">¿Validación</tspan><tspan x="1855" dy="27">aprobada?</tspan></text><rect x="1910" y="710" width="280" height="100" rx="20" class="errorbox"/><text x="2050.0" y="753.0" class="task" text-anchor="middle"><tspan x="2050.0" dy="0">Informar</tspan><tspan x="2050.0" dy="30">observaciones</tspan></text><rect x="2070" y="550" width="250" height="120" rx="20" class="successbox"/><text x="2195.0" y="603.0" class="task" text-anchor="middle"><tspan x="2195.0" dy="0">Guardar factura</tspan><tspan x="2195.0" dy="30">y sus detalles</tspan></text><rect x="2370" y="550" width="220" height="120" rx="20" class="taskbox"/><text x="2480.0" y="603.0" class="task" text-anchor="middle"><tspan x="2480.0" dy="0">Confirmar</tspan><tspan x="2480.0" dy="30">registro</tspan></text><rect x="2660" y="875" width="250" height="110" rx="20" class="taskbox"/><text x="2785.0" y="923.0" class="task"